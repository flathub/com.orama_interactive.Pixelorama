app-id: com.orama_interactive.Pixelorama
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: pixelorama
rename-icon: icon

finish-args:
  - --share=ipc
  - --socket=x11
  - --filesystem=home
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: pixelorama
    buildsystem: simple

    sources:
      - type: archive
        url: https://github.com/Orama-Interactive/Pixelorama/releases/download/v1.2.4/Pixelorama-Linux-64bit.tar.gz
        sha256: 692473e44fe90ea02de49048343d6b3cb86749b7beb166286dbc3a308c568e0b
        strip-components: 1

      - type: script
        dest-filename: pixelorama.sh
        commands:
          # `cd` is needed so that Pixelorama can find the `Brushes/` directory
          - cd /app/bin/
          # Needed so Pixelorama can run
          - /app/bin/godot-runner --main-pack /app/bin/pixelorama.pck "$@"

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.2.4/assets/graphics/icons/icon.png
        sha256: 184a59fbb665f1b9e8b2bc0d8e969903c1554cf9cbc729d68d02e846682e6419

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.2.4/Misc/Linux/com.orama_interactive.Pixelorama.desktop
        sha256: 6769fef634dc40b04e33c30a45e9dfffcb5754e4e5096d7a5fa609f6f1fa41b7

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.2.4/Misc/Linux/com.orama_interactive.Pixelorama.appdata.xml
        sha256: 382319cae7affc4039ceed89641ae7810fb0b064a9e3ea6823a32c7095a209ad

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.2.4/Misc/Linux/com.orama_interactive.Pixelorama.xml
        sha256: c3486ca631430eb0785af8069895c61cbb920b09851b346f1d2d82aeadc3a1f4

    build-commands:
      - install -Dm755 pixelorama.sh /app/bin/pixelorama
      - install -Dm644 Pixelorama.pck /app/bin/pixelorama.pck
      - mv pixelorama_data/ /app/bin/
      - install -Dm644 icon.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 com.orama_interactive.Pixelorama.desktop -t /app/share/applications/
      - install -Dm644 com.orama_interactive.Pixelorama.appdata.xml -t /app/share/appdata/
      - install -Dm644 com.orama_interactive.Pixelorama.xml -t /app/share/mime/packages/
