app-id: com.orama_interactive.Pixelorama
base: org.godotengine.godot.BaseApp
base-version: '4.6'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pixelorama
rename-icon: icon

finish-args:
  - --share=ipc
  - --socket=x11
  - --filesystem=home
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: pixelorama
    buildsystem: simple

    sources:
      - type: archive
        url: https://github.com/Orama-Interactive/Pixelorama/releases/download/v1.1.10/Pixelorama-Linux-64bit.tar.gz
        sha256: 6dac2e5b5280a0bbc20a743ac72dd329aace2424eaada3e1d047d3747280b82b
        strip-components: 1

      - type: script
        dest-filename: pixelorama.sh
        commands:
          # `cd` is needed so that Pixelorama can find the `Brushes/` directory
          - cd /app/bin/
          # Needed so Pixelorama can run
          - /app/bin/godot-runner --main-pack /app/bin/pixelorama.pck "$@"

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.1.10/assets/graphics/icons/icon.png
        sha256: 184a59fbb665f1b9e8b2bc0d8e969903c1554cf9cbc729d68d02e846682e6419

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.1.10/Misc/Linux/com.orama_interactive.Pixelorama.desktop
        sha256: 9e639b45f57a3ebeba32daa5af09be51c0785c894fa9d899fe53cdc4a76151c4

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.1.10/Misc/Linux/com.orama_interactive.Pixelorama.appdata.xml
        sha256: 136d52d1e65e0a462aebc416f1a42ed74dc9378c4cefc89c00ef74b7789746f5
      - type: patch
        path: pixelorama-appdata.patch

      - type: file
        url: https://raw.githubusercontent.com/Orama-Interactive/Pixelorama/v1.1.10/Misc/Linux/com.orama_interactive.Pixelorama.xml
        sha256: c3486ca631430eb0785af8069895c61cbb920b09851b346f1d2d82aeadc3a1f4

    build-commands:
      - install -Dm755 pixelorama.sh /app/bin/pixelorama
      - install -Dm644 Pixelorama.pck /app/bin/pixelorama.pck
      - mv pixelorama_data/ /app/bin/
      - install -Dm644 icon.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 com.orama_interactive.Pixelorama.desktop -t /app/share/applications/
      - install -Dm644 com.orama_interactive.Pixelorama.appdata.xml -t /app/share/appdata/
      - install -Dm644 com.orama_interactive.Pixelorama.xml -t /app/share/mime/packages/
